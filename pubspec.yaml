name: photobooth
description: Self Photo Studio — Flutter (Android + Windows + macOS)
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.2.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local database
  drift: ^2.28.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24

  # HTTP
  http: ^1.2.2

  # QR code display
  qr_flutter: ^4.1.0

  # QR code scanner (result screen)
  mobile_scanner: ^5.2.3

  # Image handling
  image: ^4.2.0
  image_picker: ^1.1.2
  cached_network_image: ^3.4.0

  # Print support
  printing: ^5.13.1
  pdf: ^3.11.0

  # Google Sign-In & Drive
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

  # USB (Android only — gracefully ignored on desktop)
  usb_serial: ^0.5.2

  # Path & files
  path_provider: ^2.1.4
  path: ^1.9.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2
  equatable: ^2.0.5
  logger: ^2.4.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.28.0

flutter:
  uses-material-design: true
  assets:
    - assets/frames/
    - assets/images/
